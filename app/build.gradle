plugins {
    id 'com.android.application' version '8.9.2'
}

def authProperty = { name -> groovy.json.JsonOutput.toJson(providers.gradleProperty(name).getOrElse('')) }

android {
    namespace 'com.thetechnoscribe.thepayload'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thetechnoscribe.thepayload'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'PAYLOAD_SUPABASE_URL', authProperty('PAYLOAD_SUPABASE_URL')
        buildConfigField 'String', 'PAYLOAD_SUPABASE_PUBLISHABLE_KEY', authProperty('PAYLOAD_SUPABASE_PUBLISHABLE_KEY')
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
